aid: fnality-international
name: Fnality International
description: 'Fnality International is a London-headquartered financial market infrastructure
  company that builds and operates distributed-ledger wholesale payment systems settling
  in tokenised central bank money. Backed by a consortium of 24 global financial institutions
  — including Banco Santander, BNY, Barclays, BNP Paribas, Citi, Goldman Sachs, State
  Street and UBS — Fnality launched the Sterling Fnality Payment System (£FnPS) in
  2024 as the first regulated DLT-based payment system supervised by the Bank of England,
  with US Dollar and Euro payment systems in development. The systems run on private
  Ethereum networks, giving participant banks 24/7 availability, real-time atomic and
  PvP settlement, programmable money and T+0 cross-border liquidity movement. Fnality
  Services is the operational and product-delivery arm that licenses software to participants
  and runs inter-system arrangements. Technical documentation for participants is hosted
  in a credential-gated Archbee space at docs.fnality.com; Fnality publishes no public
  developer portal, API reference or machine-readable specification.'
